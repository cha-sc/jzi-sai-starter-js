sections:
  - position: 1
    description: "Dark charcoal header with Heart & Stroke logo, search field, red Donate pill CTA, and primary nav (Heart disease, Stroke, Healthy living, What we do, How you can help, Women)."
    matchedComponent:
      registryId: "header"
      manifestName: "Header"
      variant: "WithLogoImage"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
    sectionBackground: "dark"
    content:
      Title: "Heart & Stroke"
    contentNotes: "Context-only in partial design. Utility links (Emergency signs, CPR training, For professionals) can sit in Eyebrow if needed. Logo from scraped theme images."
    variantReason: "WithLogoImage matches solid dark bar with wordmark/logo + CTA."

  - position: 2
    description: "Full-bleed lifestyle hero photo with white overlay headline, short subline, red primary CTA and outlined secondary CTA."
    matchedComponent:
      registryId: "hero"
      manifestName: "Hero"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "dark"
    content:
      Title: "Sisters Sharon and Carolyn used our Risk Screen tool to beat their risks."
      Description: "You can too."
      PrimaryCta: "Try the tool"
      SecondaryCta: "Learn more"
    contentNotes: "Live site uses full-bleed photo/video with left text overlay and pill CTAs. Hero Default overlays text on Image. Optional Phase 5.5 HeroFullBleedPills for dual CTA + heart icon treatment."
    variantReason: "Full-bleed image + overlay text matches Hero Default; theme tone.heroStyle=full-bleed-overlay."
    customVariantNeeded:
      name: "HeroFullBleedPills"
      description: "Full-bleed photo, left-aligned white headline, red pill primary CTA with heart icon, white outline secondary CTA."
      parentComponent: "Hero"

  - position: 3
    description: "Our key priorities — section heading plus three image cards (priorities carousel with arrows)."
    matchedComponent:
      registryId: "three-column-cta"
      manifestName: "Three Column CTA"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "default"
    content:
      Title: "Our key priorities"
      Item1Title: "Preventing the surge of heart failure"
      Item2Title: "Transforming stroke diagnosis, treatment and care"
      Item3Title: "Closing the gaps in health inequity"
      LinkLabel: "Discover what we do"
    contentNotes: "Live site is a carousel with 5+ priority cards; template renders a static three-column row. Heading can live in Heading CTA Compact above if needed. Phase 5.5 PrioritiesCarousel optional."
    variantReason: "Three image+title columns match the visible card strip."
    customVariantNeeded:
      name: "PrioritiesCarousel"
      description: "Horizontal priority cards with peeking next/prev arrows under Our key priorities."
      parentComponent: "Three Column CTA"

  - position: 4
    description: "Featured story band — full-bleed photo of Sharon with white text card overlay and Read her story CTA."
    matchedComponent:
      registryId: "promo-cta"
      manifestName: "Promo CTA"
      variant: "WithBackgroundImage"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "default"
    content:
      Title: "Sharon learned her risks to take charge of her health"
      Description: "After using the Risk Screen tool, Sharon was surprised by some of her unique risks. Knowing them helped her take action."
      PrimaryCta: "Read her story"
      SecondaryCta: "More stories"
      Eyebrow: "Women"
    contentNotes: "WithBackgroundImage supports photo + overlay card. Eyebrow Women if field available; else fold into Title/RichText."
    variantReason: "Story highlight on photo matches Promo CTA WithBackgroundImage."

  - position: 5
    description: "Two side-by-side research story cards (Dr. Michael Hill / Dr. Lori West) with photo backgrounds and Read more CTAs."
    matchedComponent:
      registryId: "two-column-cta"
      manifestName: "Two Column CTA"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "default"
    content:
      Item1Title: "Taking on 'impossible' strokes"
      Item1Description: "Dr. Michael Hill recounts the close calls and hard work behind a life-saving revolution."
      Item1Link: "See his research"
      Item2Title: "One baby, one heart, one huge leap"
      Item2Description: "Dr. West's bold idea rewrote the rules of heart transplants, saving babies' lives."
      Item2Link: "See her research"
    contentNotes: "Each column needs lifestyle/researcher photography."
    variantReason: "Equal dual photo+copy+CTA tiles."

  - position: 6
    description: "Get involved — vertical list of giving options with red arrow icons (Give in memory, Donate securities, Fundraise Your Way, Jump Rope for Heart)."
    matchedComponent:
      registryId: "documents-list"
      manifestName: "Documents List"
      variant: "Default"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
    sectionBackground: "default"
