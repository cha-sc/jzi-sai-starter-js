# Client Brand Theme
# Generated by the theme extraction skill from a client website.
# Place in: docs/ai/themes/<client-kebab>.theme.yaml

client:
  name: "Heart and Stroke CA"
  sourceUrl: "https://www.heartandstroke.ca/"
  extractedAt: "2026-10-09T16:51:54Z"
  extractedBy: "cursor"

colors:
  primary: "#DD2211"
  primaryForeground: "#ffffff"
  secondary: "#151212"
  secondaryForeground: "#ffffff"
  accent: "#DD2211"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#151212"
  muted: "#F4F4F4"
  mutedForeground: "#4A4A4A"
  headerBackground: "#151212"
  headerForeground: "#ffffff"
  footerBackground: "#151212"
  footerForeground: "#EDEDED"
  border: "#E0E0E0"
  ring: "#DD2211"
  extra:
    - { name: "brandRed", value: "#DD2211" }
    - { name: "charcoal", value: "#151212" }
    - { name: "softGrey", value: "#F4F4F4" }
    - { name: "linkRed", value: "#DD2211" }

typography:
  # Brand uses Neue Haas Grotesk Display (proprietary). Fallback stack for demo.
  headingFamily: "'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
  headingWeight: "800"
  bodyFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif"
  bodyWeight: "400"
  monoFamily: "ui-monospace, monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
  scale:
    hero: "3.625rem"
    h1: "2.5rem"
    h2: "2.5rem"
    h3: "1.5rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "0.02em"
  lineHeight: "relaxed"

spacing:
  density: "airy"
  sectionGap: "4.5rem"
  containerMaxWidth: "1700px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0px"
  buttonRadius: "1000px"
  cardRadius: "0px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "subtle"

tone:
  overall: "health-charity-urgent"
  colorMode: "light"
  contrast: "high"
  imagery: "photography"
  heroStyle: "full-bleed-overlay"
  cardStyle: "image-top"
  navStyle: "dark-utility-bar"

tailwind:
  colors:
    brand:
      primary: "#DD2211"
      secondary: "#151212"
      accent: "#DD2211"
  fontFamily:
    heading: ["Inter", "Helvetica Neue", "Arial", "sans-serif"]
    body: ["Inter", "Helvetica Neue", "Arial", "sans-serif"]
  borderRadius:
    DEFAULT: "0px"
    button: "1000px"
    card: "0px"

cssVariables: |
  :root {
    --brand-primary: #DD2211;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #151212;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #DD2211;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #151212;
    --brand-muted: #F4F4F4;
    --brand-muted-foreground: #4A4A4A;
    --brand-header-bg: #151212;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #151212;
    --brand-footer-fg: #EDEDED;
    --brand-border: #E0E0E0;
    --brand-ring: #DD2211;
    --brand-font-heading: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --brand-font-body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --brand-radius: 0px;
    --brand-radius-button: 9999px;
    --brand-container: 1700px;
  }

notes: |
  Primary red from live CTAs/links (rgb 221,34,17). Charcoal header/footer from computed styles.
  Brand typeface is Neue Haas Grotesk Display (licensed); demo uses Inter/Helvetica Neue as open fallback.
  Buttons are pill-shaped; cards/images are square (0 radius). Hero is full-bleed photo with white overlay text.
