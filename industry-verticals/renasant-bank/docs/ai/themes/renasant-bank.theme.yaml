# Client Brand Theme
# Generated by the theme extraction skill from a client website.
# Place in: docs/ai/themes/<client-kebab>.theme.yaml

client:
  name: "Renasant Bank"
  sourceUrl: "https://www.renasantbank.com/"
  extractedAt: "2026-10-05T15:00:00Z"
  extractedBy: "cursor"

colors:
  primary: "#041645"
  primaryForeground: "#ffffff"
  secondary: "#1B6BB8"
  secondaryForeground: "#ffffff"
  accent: "#E85E25"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#212529"
  muted: "#EEF3F8"
  mutedForeground: "#5A6570"
  headerBackground: "#ffffff"
  headerForeground: "#041645"
  footerBackground: "#041645"
  footerForeground: "#C5CDD6"
  border: "#D8DEE6"
  ring: "#1B6BB8"
  extra:
    - { name: "heroBlue", value: "#1B6BB8" }
    - { name: "securityBanner", value: "#041645" }
    - { name: "loginPanel", value: "#041645" }
    - { name: "linkNavy", value: "#0C132E" }

typography:
  headingFamily: "'Outfit', sans-serif"
  headingWeight: "700"
  bodyFamily: "'Mulish', sans-serif"
  bodyWeight: "400"
  monoFamily: "'Roboto Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@400;600;700&family=Archivo+Narrow:wght@400;600;700&display=swap"
  scale:
    hero: "3rem"
    h1: "2.25rem"
    h2: "2.0625rem"
    h3: "1.25rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "normal"
  sectionGap: "4.5rem"
  containerMaxWidth: "1280px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0.375rem"
  buttonRadius: "0.375rem"
  cardRadius: "0.25rem"
  imageRadius: "0.25rem"
  shadowStyle: "none"
  borderStyle: "subtle"

tone:
  overall: "corporate"
  colorMode: "light"
  contrast: "high"
  imagery: "photography"
  heroStyle: "full-bleed-image"
  cardStyle: "bordered"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#041645"
      secondary: "#1B6BB8"
      accent: "#E85E25"
  fontFamily:
    heading: ["Outfit", "sans-serif"]
    body: ["Mulish", "sans-serif"]
  borderRadius:
    DEFAULT: "0.375rem"
    button: "0.375rem"
    card: "0.25rem"

cssVariables: |
  :root {
    --brand-primary: #041645;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #1B6BB8;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #E85E25;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #212529;
    --brand-muted: #EEF3F8;
    --brand-muted-fg: #5A6570;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #041645;
    --brand-footer-bg: #041645;
    --brand-footer-fg: #C5CDD6;
    --brand-border: #D8DEE6;
    --brand-ring: #1B6BB8;
    --brand-heading-font: 'Outfit', sans-serif;
    --brand-body-font: 'Mulish', sans-serif;
    --brand-radius: 0.375rem;
    --brand-button-radius: 0.375rem;
    --brand-card-radius: 0.25rem;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Playwright captured desktop, mobile, and hero screenshots plus computed CSS. User-provided homepage screenshot used as visual confirmation."
    - "Primary navy rgb(4, 22, 69) → #041645: security banner, login panel, filled CTAs, footer."
    - "Hero field uses a brighter medium blue (~#1B6BB8). Scraper reported heroBackground as the navy token; visual screenshot overrides that for secondary/hero."
    - "Accent orange rgb(232, 94, 37) → #E85E25 on Login and 'Learn how to get 6.00% APY*'."
    - "Header is a white solid bar with navy wordmark and links; not a transparent overlay (scraper headerBackground was rgba(0,0,0,0) because of a transparent wrapper)."
    - "Hero H1 computed as Outfit 700 / 48px. H2 uses Archivo Narrow. Body computed as Muli; demo uses Mulish (Google Fonts successor) plus Outfit. Site also hosts Source Sans 3 locally."
    - "Buttons ~5px radius (rounded, not pills). Cards are flat/bordered with little shadow."
    - "Logo saved at docs/ai/themes/renasant-bank/images/logo.png."
