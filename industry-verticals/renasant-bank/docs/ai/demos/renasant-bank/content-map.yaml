      - name: "Renasant Bank - Card Controls"
        fields:
          Title: "Keep Your Cards in Check While You Travel"
          Text: "<p>Card controls can give you added peace of mind while you're away. With digital banking, you can manage your card settings and temporarily lock your card if it's misplaced.</p>"
          Link: { text: "Explore Card Controls", href: "https://renasantnation.com/travel-with-confidence", target: "_blank" }
        imageFields:
          - field: "Image"
            src: "https://www.renasantbank.com/-/media/renasantbank/carousel-images-renasantbank/travel-with-confidence-(1).png?mw=400&hash=A36407C4C55C15B13D4C7EF59F333D22"
            alt: "Travel with confidence"
      - name: "Renasant Bank - Digital Banking Story"
        fields:
          Title: "Banking That Moves With You"
          Text: "<p>Life doesn't slow down, and your banking shouldn't either. Renasant's digital banking tools give you the flexibility to manage your money wherever life takes you.</p>"
          Link: { text: "Digital Banking", href: "https://renasantnation.com/save-time-and-money-in-banking-fr", target: "_blank" }
        imageFields:
          - field: "Image"
            src: "https://www.renasantbank.com/-/media/renasantbank/carousel-images-renasantbank/banking-that-moves.png?mw=400&hash=5C187E5BBB622DCAFC2DFA12FC377D4A"
            alt: "Banking that moves"
      - name: "Renasant Bank - Rewards Extra"
        fields:
          Title: "Get Healthy With Extra Savings & Discounts"
          Text: "<p>Taking care of your health doesn't have to mean spending more. Renasant Rewards Extra account holders can access health-related savings through their BaZing Health Savings Card.</p>"
          Link: { text: "Explore Rewards Extra", href: "https://renasantnation.com/get-healthy-with-extra-savings-an", target: "_blank" }
        imageFields:
          - field: "Image"
            src: "https://www.renasantbank.com/-/media/renasantbank/carousel-images-renasantbank/get-healthy-with-extra-savings.png?mw=400&hash=F0B92E8AB4B2AA328C62EB075EAB00F4"
            alt: "Extra savings"
      - name: "Renasant Bank - Protect Identity"
        fields:
          Title: "Protecting Your Identity"
          Text: "<p>Identity theft can happen in ways you may not expect, but a few simple habits can help reduce your risk.</p>"
          Link: { text: "Learn More", href: "https://renasantnation.com/protecting-your-identity", target: "_blank" }
        imageFields:
          - field: "Image"
            src: "https://www.renasantbank.com/-/media/renasantbank/carousel-images-renasantbank/protect-your-identity-article.png?mw=400&hash=9247D8EB8763E068927DD85E5C9863C4"
            alt: "Protect your identity"
      - name: "Renasant Bank - Best Regional Bank"
