# Client Brand Theme — Seismic
# Extracted from: https://www.seismic.com/
# Screenshot + Playwright scraper (extracted-styles.json, meta.json)

client:
  name: "Seismic"
  sourceUrl: "https://www.seismic.com/"
  extractedAt: "2026-10-16T15:26:00Z"
  extractedBy: "cursor"

colors:
  primary: "#2D0A4E"
  primaryForeground: "#ffffff"
  secondary: "#004B50"
  secondaryForeground: "#ffffff"
  accent: "#FE5000"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#1a1a1a"
  muted: "#f4f2f5"
  mutedForeground: "#5c5666"
  headerBackground: "#2D0A4E"
  headerForeground: "#ffffff"
  footerBackground: "#2D0A4E"
  footerForeground: "#d4cde0"
  border: "#e2dde8"
  ring: "#FE5000"
  extra:
    - { name: "heroGradientStart", value: "#2D0A4E" }
    - { name: "heroGradientEnd", value: "#4A1A6B" }
    - { name: "tealSection", value: "#004B50" }
    - { name: "cardPeach", value: "#F8EDE6" }
    - { name: "orangeHover", value: "#E04800" }

typography:
  headingFamily: "'Proxima Nova', 'Montserrat', sans-serif"
  headingWeight: "500"
  bodyFamily: "'Proxima Nova', 'Montserrat', sans-serif"
  bodyWeight: "400"
  monoFamily: "'Roboto Mono', monospace"
  # Proxima Nova is Adobe Fonts (Typekit) on seismic.com; Montserrat is the Google Fonts stand-in
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
  scale:
    hero: "3.5rem"
    h1: "2.75rem"
    h2: "2rem"
    h3: "1.375rem"
    body: "1.125rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "-0.02em"
  lineHeight: "relaxed"

spacing:
  density: "comfortable"
  sectionGap: "5rem"
  containerMaxWidth: "1280px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0.625rem"
  buttonRadius: "1.625rem"
  cardRadius: "0.75rem"
  imageRadius: "0.5rem"
  shadowStyle: "subtle"
  borderStyle: "subtle"

tone:
  overall: "enterprise-saas"
  colorMode: "mixed"
  contrast: "high"
  imagery: "product-ui-and-photography"
  heroStyle: "full-bleed-gradient"
  cardStyle: "soft-fill"
  navStyle: "transparent-over-hero"

tailwind:
  colors:
    brand:
      primary: "#2D0A4E"
      secondary: "#004B50"
      accent: "#FE5000"
  fontFamily:
    heading: ["Montserrat", "Proxima Nova", "sans-serif"]
    body: ["Montserrat", "Proxima Nova", "sans-serif"]
  borderRadius:
    DEFAULT: "0.625rem"
    button: "1.625rem"
    card: "0.75rem"

cssVariables: |
  :root {
    --brand-primary: #2D0A4E;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #004B50;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #FE5000;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #1a1a1a;
    --brand-muted: #f4f2f5;
    --brand-muted-fg: #5c5666;
    --brand-header-bg: #2D0A4E;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #2D0A4E;
    --brand-footer-fg: #d4cde0;
    --brand-border: #e2dde8;
    --brand-ring: #FE5000;
    --brand-card-peach: #F8EDE6;
    --brand-teal: #004B50;
    --brand-radius: 0.625rem;
    --brand-button-radius: 1.625rem;
  }

extraction:
  confidence: "high"
  method: "screenshot + playwright-scraper"
  notes:
    - "Primary CTA orange measured as rgb(254, 80, 0) / #FE5000 from computed styles"
    - "Hero/header/footer deep purple ~#2D0A4E; CSS --background HSL maps to dark violet"
    - "Teal sections (#004B50) used for Ask AI and stats/lead-gen bands"
    - "Outcome cards use light peach/blush fills (#F8EDE6 approx)"
    - "Buttons are high-radius pills (~26px)"
    - "Live font is Proxima Nova via Adobe Fonts; Montserrat used as Google Fonts substitute"
    - "Scraper body font fell back to Times New Roman (ignore); headings correctly report proxima-nova"
