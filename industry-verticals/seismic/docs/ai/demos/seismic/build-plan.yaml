      registryId: "promo-cta"
      manifestName: "Promo CTA"
      variant: "Default"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
    sectionBackground: "default"
    content:
      Title: "Strengthen Client Relationships and Drive Advisor Growth"
      Description: "Equip advisors, wholesalers, bankers, relationship managers, and agents with compliant content, real-time insights, and guided workflows that make every client interaction count."
      PrimaryCta: "Explore Financial Services Solutions"
    contentNotes: "Tabs not in Financial library — ship FS panel as Promo CTA; optional IndustryTabs variant in Phase 5.5."
    variantReason: "Text + lifestyle image + orange CTA split."
    customVariantNeeded:
      name: "IndustryTabs"
      description: "Purple rounded tabs over split text/image industry panels (Financial Services, Manufacturing, Technology, Life Sciences)."
      parentComponent: "Promo CTA"

  - position: 5
    description: "Centered headline about revenue enablement platform + customer story carousel (Elastic / video testimonials) with Read Success Story CTA."
    matchedComponent:
      registryId: "testimonials"
      manifestName: "Testimonials"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
