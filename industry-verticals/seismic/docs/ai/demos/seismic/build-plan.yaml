sections:
  - position: 1
    description: "Dark purple header with Seismic logo, Platform/Solutions/Resources/Partners/Why Choose Seismic?, search + language, Login, orange Contact/Get a Demo CTA."
    matchedComponent:
      registryId: "header"
      manifestName: "Header"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
    sectionBackground: "dark"
    content:
      Title: "Seismic"
      PrimaryCta: "Get a Demo"
    contentNotes: "Context-only. Nav: Platform, Solutions, Resources, Partners, Why Choose Seismic?. CTA orange pill."
    variantReason: "Solid dark brand header over purple hero; Financial Header Default."

  - position: 2
    description: "Deep purple gradient hero — Move from preparation to GTM performance, supporting copy, orange Get a Demo, product/dashboard graphic, optional floating Get a Demo / Watch / Tour strip."
    matchedComponent:
      registryId: "hero"
      manifestName: "Hero"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "dark"
    content:
      Title: "Move from preparation to GTM performance"
      Description: "Trusted content, intelligence, and role-based agents everywhere your teams work."
      PrimaryCta: "Get a Demo"
    contentNotes: "Hero media: stylized product UI / dashboard graphic on right. Eyebrow optional: THE AI PLATFORM FOR REVENUE EXECUTION."
    variantReason: "Full-bleed purple gradient hero with headline + CTA + side media matches Financial Hero."
    customVariantNeeded:
      name: "PurpleGradientSplit"
      description: "Dark purple/violet gradient background, left text stack, right floating product UI graphic, pill orange CTA."
      parentComponent: "Hero"

  - position: 3
    description: "Trusted by approximately 2,000 organizations worldwide + grayscale logo row (IBM, Oracle, Expedia, Elastic, Experian, etc.)."
    matchedComponent:
      registryId: "image-gallery"
      manifestName: "Image Gallery"
      variant: "Default"
      matchType: "template"
      matchConfidence: "medium"
      apiAddable: true
    sectionBackground: "muted"
    content:
      Title: "Trusted by approximately 2,000 organizations worldwide"
    contentNotes: "Logo strip; Image Gallery is closest Financial match (no LogoCloud). Phase 5.5 LogoRow optional."
    variantReason: "Horizontal logo row under trust headline."
    customVariantNeeded:
      name: "LogoRow"
      description: "Centered trust headline + single-row grayscale partner logos."
      parentComponent: "Image Gallery"

  - position: 4
    description: "Solutions by Industry — purple pill tabs (Financial Services active, Manufacturing, Technology, Life Sciences) + left copy/CTA + right lifestyle photo with UI overlays."
