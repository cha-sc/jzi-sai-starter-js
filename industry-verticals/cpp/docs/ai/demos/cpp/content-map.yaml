      - name: "CPP - FAQ Canada-wide"
        fields:
          Title: "Do you offer life insurance Canada-wide?"
          Content: "<p>Yes, Canada Protection Plan from Foresters Financial’s suite of life insurance products is available to Canadians 18–80 across the nation.</p>"
        imageFields: []
      - name: "CPP - FAQ Who needs"
        fields:
          Title: "Who needs life insurance in Canada?"
          Content: "<p>Families, seniors, young adults or temporary residents Canada-wide benefit from life insurance to protect loved ones from financial burdens, regardless of health or lifestyle.</p>"
        imageFields: []
      - name: "CPP - FAQ Cost"
        fields:
          Title: "How much does life insurance cost in Canada?"
          Content: "<p>Our coverage can potentially start as low as $15 a month. Get fast, affordable life insurance quotes in Canada using our Quick Quote tool – available online in just minutes.</p>"
        imageFields: []
      - name: "CPP - FAQ No medical benefit"
        fields:
          Title: "What’s the benefit of no medical life insurance in Canada?"
          Content: "<p>No medical life insurance in Canada lets you skip medical exams and needles, offering fast coverage in as little as 24 hours. It’s a great option even for those with health issues or high-risk hobbies.</p>"
        imageFields: []
      - name: "CPP - FAQ Types"
        fields:
          Title: "What types of life insurance are available?"
          Content: "<p>You can choose between term life insurance (e.g., 10–30 years) or whole life insurance (permanent coverage) for lifelong protection. Both offer protection tailored to your needs, with simplified and no-medical options.</p>"
        imageFields: []
      - name: "CPP - FAQ Apply"
        fields:
          Title: "How do I apply for life insurance in Canada?"
          Content: "<p>Use our Insurance Calculator to estimate coverage and apply for a no-obligation quote via phone (1-877-851-9090) or online.</p>"
        imageFields: []
    imageFields: []
