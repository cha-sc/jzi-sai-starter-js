# Client Brand Theme
# Generated by the theme extraction skill from a client website.
# Place in: docs/ai/themes/<client-kebab>.theme.yaml

client:
  name: "CPP"
  sourceUrl: "https://cpp.ca"
  extractedAt: "2026-10-06T16:05:00Z"
  extractedBy: "cursor"

colors:
  primary: "#007B88"
  primaryForeground: "#ffffff"
  secondary: "#5E2750"
  secondaryForeground: "#ffffff"
  accent: "#F5C518"
  accentForeground: "#1a1a1a"
  background: "#ffffff"
  foreground: "#676767"
  muted: "#F4F0F7"
  mutedForeground: "#676767"
  headerBackground: "#ffffff"
  headerForeground: "#5E2750"
  footerBackground: "#2A2A2A"
  footerForeground: "#E5E5E5"
  border: "#E0E0E0"
  ring: "#007B88"
  extra:
    - { name: "heroLavender", value: "#EDE7F3" }
    - { name: "softYellow", value: "#F7E27A" }
    - { name: "actionTeal", value: "#006B75" }
    - { name: "headingPurple", value: "#5E2750" }
    - { name: "starGold", value: "#E8B923" }

typography:
  headingFamily: "'Open Sans', sans-serif"
  headingWeight: "800"
  bodyFamily: "'Open Sans', sans-serif"
  bodyWeight: "500"
  monoFamily: "'Roboto Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
  scale:
    hero: "3.3rem"
    h1: "2.5rem"
    h2: "1.75rem"
    h3: "1.55rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "normal"
  sectionGap: "4rem"
  containerMaxWidth: "1200px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0.5rem"
  buttonRadius: "1000px"
  cardRadius: "0.75rem"
  imageRadius: "0.5rem"
  shadowStyle: "subtle"
  borderStyle: "subtle"

tone:
  overall: "friendly-insurance"
  colorMode: "light"
  contrast: "medium"
  imagery: "photography-plus-illustration"
  heroStyle: "split-image-text"
  cardStyle: "image-top"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#007B88"
      secondary: "#5E2750"
      accent: "#F5C518"
  fontFamily:
    heading: ["Open Sans", "sans-serif"]
    body: ["Open Sans", "sans-serif"]
  borderRadius:
    DEFAULT: "0.5rem"
    button: "1000px"
    card: "0.75rem"

cssVariables: |
  :root {
    --brand-primary: #007B88;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #5E2750;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #F5C518;
    --brand-accent-foreground: #1a1a1a;
    --brand-bg: #ffffff;
    --brand-fg: #676767;
    --brand-muted: #F4F0F7;
    --brand-muted-fg: #676767;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #5E2750;
    --brand-footer-bg: #2A2A2A;
    --brand-footer-fg: #E5E5E5;
    --brand-border: #E0E0E0;
    --brand-ring: #007B88;
    --brand-hero-lavender: #EDE7F3;
    --brand-soft-yellow: #F7E27A;
    --brand-font-heading: "Open Sans", sans-serif;
    --brand-font-body: "Open Sans", sans-serif;
    --brand-radius: 0.5rem;
    --brand-radius-button: 1000px;
    --brand-radius-card: 0.75rem;
  }

extraction:
  confidence: "high"
  method: "playwright-scraper+screenshot"
  notes:
    - "Primary teal from computed CTA button: rgb(0,123,136) → #007B88."
    - "Purple secondary (#5E2750) from logo/heading brand color in screenshot (not in computed button styles)."
    - "Accent yellow from yellow feature sections and cartoon illustration backgrounds."
    - "Site uses proprietary Elza for some headings; demo substitutes Open Sans (already on site via Google Fonts) for reliability."
    - "Buttons are fully pill-shaped (border-radius 1000px)."
    - "Hero is split text + photography on a soft lavender background."
