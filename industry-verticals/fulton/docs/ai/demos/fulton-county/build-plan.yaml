sections:
  - position: 1
    description: "Dark navy utility bar with quick links (Elections, Jobs, Calendar, Payments, News, Maps, Customer Service, Watch FGTV) and language selector"
    matchedComponent:
      registryId: "eyebrow"
      manifestName: "Eyebrow"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
    sectionBackground: "dark"
    content:
      links:
        - "Elections"
        - "Jobs"
        - "Calendar"
        - "Commission District Finder"
        - "Payments"
        - "News"
        - "Maps"
        - "Customer Service"
        - "Watch FGTV"
    notes: "Lives in header partial design — update Link List datasource + restyle to Fulton navy utility bar"

  - position: 2
    description: "White header with Fulton County logo (oak seal + FULTON/COUNTY wordmark) and uppercase main nav"
    matchedComponent:
      registryId: "header"
      manifestName: "Header"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
    sectionBackground: "default"
    content:
      brand: "FULTON COUNTY"
      nav:
        - "Email Newsletters"
        - "Services"
        - "Property and Vehicles"
        - "Business Services"
        - "Courts"
        - "Commissioners"
        - "Get Involved"
        - "Inside Fulton County"
    notes: "Partial design — update logo media + Navigation items; wordmark colors already themed (blue/orange)"

  - position: 3
    description: "Full-bleed Government Center photo with centered white search bar overlay ('I need help finding...')"
    matchedComponent:
      registryId: "hero"
      manifestName: "Hero"
      variant: "SearchOverlay"
      matchType: "custom"
      matchConfidence: "medium"
      apiAddable: true
      customVariantNeeded:
        name: "SearchOverlay"
        description: "Full-bleed background image with centered search input overlay; minimal/no headline text"
        parentComponent: "Hero"
    sectionBackground: "default"
    content:
      placeholder: "I need help finding..."
      image: "Fulton County Government Center exterior"
    notes: "Existing Hero shows title/subtitle/CTA. Need SearchOverlay variant (or lightweight custom) to match live site."

  - position: 4
    description: "Navy band 'FULTON COUNTY GOVERNMENT / TOP SERVICES' with 8 white icon service cards in a 4x2 grid"
    matchedComponent:
      registryId: "top-services"
      manifestName: "TopServices"
      variant: "FourByTwo"
      matchType: "custom"
      matchConfidence: "medium"
      apiAddable: true
      customVariantNeeded:
        name: "FourByTwo"
        description: "Dark navy section, uppercase title, 4x2 white cards with icon + title + orange Read More"
        parentComponent: "FourColumnCta"
    sectionBackground: "primary"
    content:
      eyebrow: "FULTON COUNTY GOVERNMENT"
      title: "TOP SERVICES"
      cards:
        - { title: "Registration and Elections", cta: "More about Registration and Elections" }
        - { title: "Commission District Finder", cta: "View Interactive Maps" }
        - { title: "Employment opportunities", cta: "Read More" }
        - { title: "Watch FGTV", cta: "READ MORE" }
        - { title: "Senior Centers", cta: "Read More" }
        - { title: "BOC Meeting Schedule", cta: "Read More" }
        - { title: "Experience Fulton the Podcast", cta: "Read More" }
        - { title: "A - Z Directory", cta: "View Guide" }
    notes: "Fallback if custom skipped: two stacked FourColumnCta datasources on navy background"

  - position: 5
    description: "News & Information — two-column news cards with image, date, headline, excerpt, orange Read More; Browse More News CTA"
    matchedComponent:
      registryId: "article-list"
      manifestName: "ArticleList"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: true
    sectionBackground: "muted"
