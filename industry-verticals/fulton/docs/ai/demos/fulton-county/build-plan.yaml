        - { name: "Bridget Thorne", position: "District 1" }
        - { name: "Bob Ellis", position: "District 2" }
        - { name: "Dana Barrett", position: "District 3" }
        - { name: "Marvin S. Arrington, Jr.", position: "District 5" }
        - { name: "Khadijah Abdur-Rahman", position: "Vice Chair, District 6" }
