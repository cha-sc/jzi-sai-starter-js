    notes: "Reuse ArticleList; replace PLAY finance articles with Fulton County news content + images"

  - position: 6
    description: "What is my District? — address lookup form on left, district map / district cards on right"
    matchedComponent:
      registryId: "district-finder"
      manifestName: "DistrictFinder"
      variant: "Default"
      matchType: "custom"
      matchConfidence: "low"
      apiAddable: true
    sectionBackground: "primary"
    content:
      title: "What is my District?"
      description: "Enter your address to find out which district you live in"
      districts:
        - "District 1 - Bridget Thorne"
        - "District 2 - Bob Ellis"
        - "District 3 - Dana Barrett"
        - "District 4 - Vacant"
        - "District 5 - Marvin S. Arrington, Jr."
        - "District 6 - Khadijah Abdur-Rahman"
    notes: "Interactive GIS is out of scope for demo. Build visual DistrictFinder (form UI + map image / district cards). Fallback: TwoColumnCta with map image (non-interactive)."

  - position: 7
    description: "Board of Commissioners — intro copy + chairman feature + grid of commissioner profiles"
