  - position: 8
    description: "Footer — Contact Us, Helpful Links columns, social icons, copyright"
    matchedComponent:
      registryId: "footer"
      manifestName: "Footer"
      variant: "Default"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
    sectionBackground: "dark"
    content:
      address: "141 Pryor St. SW Atlanta, GA 30303"
      phone: "404-612-4000"
      email: "customerservice@fultoncountyga.gov"
      copyright: "©2026 Fulton County Government"
    notes: "Partial design — update Link Lists + contact rich text; footer already uses --bg-footer navy"

