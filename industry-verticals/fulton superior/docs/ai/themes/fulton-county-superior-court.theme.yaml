# Client Brand Theme — Superior Court of Fulton County
# Extracted from user-provided homepage mockup (screenshot-only).
# Confidence: medium (no live CSS scrape; colors sampled visually from mockup).

client:
  name: "Superior Court of Fulton County"
  sourceUrl: ""
  extractedAt: "2026-09-17T21:05:00Z"
  extractedBy: "cursor"

colors:
  primary: "#1a1a1a"
  primaryForeground: "#ffffff"
  secondary: "#2c3e50"
  secondaryForeground: "#ffffff"
  accent: "#c73e1d"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#1a1a1a"
  muted: "#f5f5f5"
  mutedForeground: "#5a5a5a"
  headerBackground: "#1a1a1a"
  headerForeground: "#ffffff"
  footerBackground: "#f5f5f5"
  footerForeground: "#1a1a1a"
  border: "#e0e0e0"
  ring: "#c73e1d"
