# Client Brand Theme — Fasken
# Extracted from: https://www.fasken.com/en
# Screenshot + Playwright scraper (extracted-styles.json, meta.json)

client:
  name: "Fasken"
  sourceUrl: "https://www.fasken.com/en"
  extractedAt: "2026-11-24T15:56:00Z"
  extractedBy: "cursor"

colors:
  primary: "#333132"
  primaryForeground: "#ffffff"
  secondary: "#81716A"
  secondaryForeground: "#ffffff"
  accent: "#E35205"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#333132"
  muted: "#F2F1F2"
  mutedForeground: "#6B6567"
  headerBackground: "#ffffff"
  headerForeground: "#333132"
  footerBackground: "#F2F1F2"
  footerForeground: "#333132"
  border: "#D9D6D7"
  ring: "#E35205"
  extra:
    - { name: "footerBar", value: "#333132" }
    - { name: "heroSurface", value: "#F2F1F2" }
    - { name: "carouselInactive", value: "#4A4748" }
    - { name: "taupeLink", value: "#81716A" }
    - { name: "orangeHover", value: "#C94704" }

typography:
  headingFamily: "'Gordita', 'Montserrat', Helvetica, Arial, sans-serif"
  headingWeight: "900"
  bodyFamily: "'Gordita', 'Montserrat', Helvetica, Arial, sans-serif"
  bodyWeight: "400"
  monoFamily: "'Roboto Mono', monospace"
  # Gordita is self-hosted on fasken.com; Montserrat is the Google Fonts stand-in
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap"
  scale:
    hero: "2.375rem"
    h1: "2.375rem"
    h2: "1.625rem"
    h3: "1rem"
    body: "0.875rem"
    small: "0.75rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "comfortable"
  sectionGap: "4rem"
  containerMaxWidth: "1400px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0"
  buttonRadius: "0.25rem"
  cardRadius: "0"
  imageRadius: "0"
  shadowStyle: "none"
  borderStyle: "hairline"

tone:
  overall: "professional-law-firm"
  colorMode: "light"
  contrast: "high"
  imagery: "abstract-metal-and-editorial-photography"
  heroStyle: "split-copy-image-carousel"
  cardStyle: "flat-image-over-text"
  navStyle: "white-bar-utility-plus-primary"

tailwind:
  colors:
    brand:
      primary: "#333132"
      secondary: "#81716A"
      accent: "#E35205"
  fontFamily:
    heading: ["Montserrat", "Gordita", "sans-serif"]
    body: ["Montserrat", "Gordita", "sans-serif"]
  borderRadius:
    DEFAULT: "0"
    button: "0.25rem"
    card: "0"

cssVariables: |
  :root {
    --brand-primary: #333132;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #81716A;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #E35205;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #333132;
    --brand-muted: #F2F1F2;
    --brand-muted-fg: #6B6567;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #333132;
    --brand-footer-bg: #F2F1F2;
    --brand-footer-fg: #333132;
    --brand-footer-bar: #333132;
    --brand-border: #D9D6D7;
    --brand-ring: #E35205;
    --brand-hero-surface: #F2F1F2;
    --brand-radius: 0;
    --brand-button-radius: 0.25rem;
  }

extraction:
  confidence: "high"
  method: "screenshot + playwright-scraper"
  notes:
    - "Theme color / charcoal #333132 from meta theme-color and computed bodyColor"
    - "Accent orange ~#E35205 from LEARN MORE ghost buttons and orange triangle markers (visual sample from homepage screenshot)"
    - "Secondary/link taupe rgb(129,113,106) / #81716A from computed linkColor"
    - "Hero surface #F2F1F2 from computed heroBackground"
    - "Typography is Gordita (self-hosted); Montserrat used as Google Fonts stand-in"
    - "Sharp geometry: 0px card/image radius; slight button radius only"
    - "Hero scraper capture included cookie modal; user desktop screenshot used as primary layout reference"
