      Title: "Named Global Mining Law Firm of the Year for the 18th Time"
      Description: "Our Global Mining Group has received this recognition more times than any other law firm in the world."
      PrimaryCta: "Learn more"
    contentNotes: "Default Hero overlays copy on media; live site is a true left-copy / right-image split with numbered slide tabs. Phase 5.5 FaskenSplitHeroCarousel can match closely."
    variantReason: "Closest SXA hero for headline + CTA + dominant media."
    customVariantNeeded:
      name: "FaskenSplitHeroCarousel"
      description: "Left column headline + body + orange outline LEARN MORE; right column full-bleed abstract image; five numbered dark tabs under the media that switch slides."
