    description: "Split hero — left headline Named Global Mining Law Firm of the Year for the 18th Time + LEARN MORE orange outline CTA; right abstract black/white metal imagery; numbered carousel tabs 01–05 under the image."
    matchedComponent:
      registryId: "hero"
