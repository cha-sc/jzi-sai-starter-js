    description: "White header with FASKEN wordmark (Own tomorrow) and primary nav: People, Services, Experience, Knowledge, More +."
    matchedComponent:
      registryId: "header"
      manifestName: "Header"
      variant: "WithLogoImage"
      matchType: "template"
      matchConfidence: "high"
      apiAddable: false
      variantMatch: "exact"
