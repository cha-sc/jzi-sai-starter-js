  monoFamily: "'Roboto Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Oswald:wght@400;500;600;700&display=swap"
  scale:
    hero: "2.75rem"
