  colorMode: "light"
  contrast: "high"
  imagery: "product-lifestyle-photography"
  heroStyle: "full-bleed-gradient-promo"
  cardStyle: "image-above-link"
  navStyle: "solid-teal-bar"

tailwind:
  colors:
    brand:
      primary: "#0096D6"
      secondary: "#003A5D"
      accent: "#0077C8"
  fontFamily:
    heading: ["Oswald", "sans-serif"]
    body: ["Lato", "sans-serif"]
  borderRadius:
    DEFAULT: "0.25rem"
    button: "0.25rem"
    card: "0"

cssVariables: |
  :root {
    --brand-primary: #0096D6;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #003A5D;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #0077C8;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #2B2B2B;
    --brand-muted: #F5F7F8;
    --brand-muted-fg: #5A5A5A;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #2B2B2B;
    --brand-footer-bg: #ffffff;
    --brand-footer-fg: #2B2B2B;
    --brand-border: #D0D5D8;
    --brand-ring: #0096D6;
    --brand-nav-bar: #0096D6;
    --brand-hero-navy: #003A5D;
    --brand-font-heading: "Oswald", sans-serif;
    --brand-font-body: "Lato", sans-serif;
    --brand-radius: 0.25rem;
    --brand-radius-button: 0.25rem;
    --brand-radius-card: 0;
  }

extraction:
  confidence: "high"
  method: "user-homepage-screenshot+playwright-fonts"
  notes:
    - "Primary visual reference: user-provided full homepage screenshot (Blue Premier hero, category grid, alternating blocks)."
    - "Playwright scraper landed on region-select gate; fonts (Oswald/Lato) and container width (1320px) taken from scraper; brand blues from homepage screenshot/nav bar."
    - "Buttons are rectangular (small radius), uppercase LEARN MORE CTAs in solid brand blue."
    - "Nav is a solid teal/cyan bar with white links under a white logo/search header."
