# Client Brand Theme — PJM
# Extracted from: https://www.pjm.com/ + homepage screenshot

client:
  name: "PJM"
  sourceUrl: "https://www.pjm.com/"
  extractedAt: "2026-09-26T04:37:00Z"
  extractedBy: "cursor"

colors:
  primary: "#005596"
  primaryForeground: "#ffffff"
  secondary: "#333333"
  secondaryForeground: "#ffffff"
  accent: "#0077c8"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#333333"
  muted: "#f5f5f5"
  mutedForeground: "#666666"
  headerBackground: "#ffffff"
  headerForeground: "#005596"
  footerBackground: "#454545"
  footerForeground: "#cccccc"
  border: "#dddddd"
  ring: "#005596"
  extra:
    - { name: "utilityBar", value: "#333333" }
